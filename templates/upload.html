{% extends "base.html" %}
{% block title %}Upload Timetable{% endblock %}

{% block content %}
<h2 class="text-lg font-medium text-gray-700 mb-4">Upload Timetable Photo</h2>

<div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
    <form method="POST" enctype="multipart/form-data" class="space-y-4">
        {{ csrf_token() }}
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Select timetable image</label>
            <input type="file" name="file" accept="image/*" capture="environment" required
                   class="w-full px-4 py-3 border-2 border-dashed border-gray-300 rounded-lg text-sm hover:border-blue-400 focus:outline-none focus:ring-2 focus:ring-blue-500 touch-target">
        </div>
        <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-lg font-medium text-base touch-target">
            Extract & Save Timetable
        </button>
    </form>
</div>

<div class="mt-6 text-sm text-gray-500 space-y-2">
    <p>Tips for best results:</p>
    <ul class="list-disc list-inside space-y-1">
        <li>Clear, well-lit photo of timetable</li>
        <li>All days and times visible</li>
        <li>Subject names readable</li>
    </ul>
</div>

<a href="{{ url_for('view_timetable') }}" class="block mt-4 text-center text-blue-600 hover:underline text-sm">View Saved Timetable</a>
{% endblock %}
