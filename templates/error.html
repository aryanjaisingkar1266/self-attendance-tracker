{% extends "base.html" %}
{% block title %}Error {{ code }}{% endblock %}

{% block content %}
<div class="text-center py-12">
    <div class="text-6xl mb-4">{{ '😕' if code == 404 else '😰' if code == 500 else '⚠️' }}</div>
    <h2 class="text-2xl font-bold text-gray-800 mb-2">Error {{ code }}</h2>
    <p class="text-gray-600 mb-6">{{ message }}</p>
    <a href="{{ url_for('index') if current_user.is_authenticated else url_for('login') }}" class="inline-block bg-blue-600 text-white px-6 py-3 rounded-lg font-medium touch-target">
        Go to {% if current_user.is_authenticated %}Dashboard{% else %}Login{% endif %}
    </a>
</div>
{% endblock %}
