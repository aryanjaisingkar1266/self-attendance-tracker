<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Attendance">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📅</text></svg>">
    <title>{% block title %}Attendance Tracker{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media (max-width: 768px) {
            input, button, select, textarea { font-size: 16px !important; }
        }
        .touch-target { min-height: 48px; min-width: 48px; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <nav class="bg-white border-b border-gray-200 sticky top-0 z-10">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl font-semibold text-gray-800">Attendance</h1>
            <div class="flex gap-1">
                <a href="{{ url_for('index') }}" class="flex-1 px-3 py-2 text-sm rounded-lg text-center touch-target {% if request.endpoint == 'index' %}bg-blue-600 text-white{% else %}text-gray-600{% endif %}">Today</a>
                <a href="{{ url_for('upload') }}" class="flex-1 px-3 py-2 text-sm rounded-lg text-center touch-target {% if request.endpoint == 'upload' %}bg-blue-600 text-white{% else %}text-gray-600{% endif %}">Timetable</a>
                <a href="{{ url_for('analytics') }}" class="flex-1 px-3 py-2 text-sm rounded-lg text-center touch-target {% if request.endpoint == 'analytics' %}bg-blue-600 text-white{% else %}text-gray-600{% endif %}">Analytics</a>
            </div>
        </div>
    </nav>
    
    <main class="max-w-md mx-auto px-4 py-6 pb-24">
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="mb-4 p-3 bg-green-100 text-green-800 rounded text-sm">
                    {% for m in messages %}{{ m }}{% endfor %}
                </div>
            {% endif %}
        {% endwith %}
        
        {% block content %}{% endblock %}
    </main>
</body>
</html>
